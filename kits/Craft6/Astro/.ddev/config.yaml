name: starter-astro
type: laravel
docroot: backend/public
php_version: "8.5"
nodejs_version: "22"
webserver_type: nginx-fpm
composer_root: backend
xdebug_enabled: false
additional_hostnames:
  - api.starter-astro
database:
    type: postgres
    version: "17"
use_dns_when_possible: true
composer_version: "2"
corepack_enable: false
upload_dirs:
  - uploads
web_extra_exposed_ports:
  - name: astro
    container_port: 4321
    http_port: 4321
    https_port: 4322
web_environment:
  - VIRTUAL_HOST=starter-astro.ddev.site,api.starter-astro.ddev.site
  - APP_URL=https://api.starter-astro.ddev.site
  - PRIMARY_SITE_URL=https://starter-astro.ddev.site

web_extra_daemons:
  - name: "astro"
    command: "cd /var/www/html/frontend && npm run dev -- --host"
    directory: "/var/www/html/frontend"
