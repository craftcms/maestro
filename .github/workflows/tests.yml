name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer Dependencies
        working-directory: orchestrator
        run: composer install --no-interaction --prefer-dist

      - name: Run Tests
        working-directory: orchestrator
        run: php artisan test

      - name: Kit Matrix
        id: matrix
        working-directory: orchestrator
        run: echo "matrix=$(php artisan kits:matrix)" >> "$GITHUB_OUTPUT"

  kits:
    name: ${{ matrix.name }}
    needs: orchestrator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.orchestrator.outputs.matrix) }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: craft
          POSTGRES_PASSWORD: craft
          POSTGRES_DB: craft
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.craft == 6 && '8.5' || '8.4' }}
          extensions: pdo_pgsql, intl, gd, zip, bcmath
          coverage: none

      - name: Build ${{ matrix.name }}
        working-directory: orchestrator
        run: |
          composer install --no-interaction --prefer-dist
          php artisan build ${{ matrix.kit }}

      - name: Install Composer Dependencies
        working-directory: build/${{ matrix.root }}
        run: composer install --no-interaction --prefer-dist

      - name: Install Craft
        working-directory: build/${{ matrix.root }}
        run: |
          # Write settings into .env: PHP's built-in server doesn't pass the process environment on.
          set_env() { grep -q "^$1=" .env && sed -i "s|^$1=.*|$1=$2|" .env || echo "$1=$2" >> .env; }

          if [ "${{ matrix.craft }}" = 5 ]; then
            cp .env.example.dev .env
            set_env CRAFT_DB_DRIVER pgsql
            set_env CRAFT_DB_SERVER 127.0.0.1
            set_env CRAFT_DB_PORT 5432
            set_env CRAFT_DB_DATABASE craft
            set_env CRAFT_DB_USER craft
            set_env CRAFT_DB_PASSWORD craft
            set_env CRAFT_SECURITY_KEY ci
            set_env PRIMARY_SITE_URL http://127.0.0.1:8000
            set_env CRAFT_BASE_CP_URL http://127.0.0.1:8000
            php craft install --interactive=0 --username=admin --email=admin@example.com --password=password
            php -S 127.0.0.1:8000 -t web web/index.php &
          else
            cp .env.example .env
            set_env DB_CONNECTION pgsql
            set_env DB_HOST 127.0.0.1
            set_env DB_PORT 5432
            set_env DB_DATABASE craft
            set_env DB_USERNAME craft
            set_env DB_PASSWORD craft
            set_env APP_URL http://127.0.0.1:8000
            php artisan key:generate
            php artisan craft:install --no-interaction --username=admin --email=admin@example.com --password=password
            php artisan serve --port=8000 &
          fi

          # Installing must not rewrite the kit's project config, which happens when
          # its schema version no longer matches the Craft version in composer.json.
          git diff --exit-code -- config/project config/craft/project

      - uses: actions/setup-node@v5
        if: hashFiles('build/frontend/package.json') != ''
        with:
          node-version: '22'

      - name: Build Frontend
        if: hashFiles('build/frontend/package.json') != ''
        working-directory: build/frontend
        # Some frameworks (e.g. Next) render pages from the API at build time, so point
        # them at the backend started above. These override the values in .env.
        env:
          CRAFT_URL: http://127.0.0.1:8000
          CRAFT_DOMAIN: 127.0.0.1
          BASE_URL: http://127.0.0.1:3000
          PUBLIC_GQL_HOST: http://127.0.0.1:8000/api
        run: |
          cp .env.example .env
          npm install
          npm run build

      - name: Smoke Test
        run: |
          sleep 3
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/admin/login
          # Headless kits serve their front end from frontend/, not from Craft.
          if [ -z "${{ matrix.root }}" ]; then
            curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/
          fi
