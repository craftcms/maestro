name: Build and Push Kit Changes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - id: matrix
        working-directory: orchestrator
        run: |
          composer install --no-interaction --prefer-dist
          echo "matrix=$(php artisan kits:matrix)" >> "$GITHUB_OUTPUT"

  push:
    name: Push ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: maestro
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Build ${{ matrix.name }}
        working-directory: maestro/orchestrator
        run: |
          composer install --no-interaction --prefer-dist
          php artisan build ${{ matrix.kit }}

      - uses: actions/setup-node@v5
        if: matrix.build != ''
        with:
          node-version: '22'

      # Built assets aren't committed to Maestro; kits that ship them build them here.
      - name: Build Assets
        if: matrix.build != ''
        working-directory: maestro/build
        env:
          BUILD: ${{ matrix.build }}
        run: bash -c "$BUILD"

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repository }}
          path: kit
          fetch-depth: 0
          token: ${{ secrets.STARTER_KIT_TOKEN }}

      - name: Copy Build to Kit
        working-directory: kit
        run: |
          # The first push to a new branch (e.g. 6.x) starts it from the default branch.
          git checkout ${{ matrix.branch }} 2>/dev/null || git checkout -b ${{ matrix.branch }}
          # --force below would add node_modules too, and kits don't ship npm lock files.
          rsync -a --delete --exclude .git --exclude node_modules --exclude package-lock.json ../maestro/build/ .

      - name: Commit and Push
        working-directory: kit
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # --force: kits commit some files their .gitignore excludes, like the starter logo.
          git add -A --force
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.name }}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${MESSAGE:-Update from Maestro}" -m "Built by craftcms/maestro@${{ github.sha }}"
          git push origin ${{ matrix.branch }}
